name: Codigo Estrada PT - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/codigo-estrada-android-v0.4
    paths:
      - 'codigo-estrada-android-build/payload/**'
      - '.github/workflows/codigo-estrada-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify v0.4 source package
        run: |
          cat codigo-estrada-android-build/payload/chunk_*.b64 > /tmp/CodigoEstradaPT_Android_v0.4.b64
          base64 -d /tmp/CodigoEstradaPT_Android_v0.4.b64 > /tmp/CodigoEstradaPT_Android_v0.4.zip
          echo "7487f8c08e117859af625cdd4509284a7148c7fcec5b0f34b842296285a5470c  /tmp/CodigoEstradaPT_Android_v0.4.zip" | sha256sum -c -
          mkdir -p /tmp/codigo-build
          unzip -q /tmp/CodigoEstradaPT_Android_v0.4.zip -d /tmp/codigo-build
          test -f /tmp/codigo-build/codigo_estrada_pt_app/settings.gradle.kts

      - name: Align Java and Kotlin to JVM 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/codigo-build/codigo_estrada_pt_app/app/build.gradle.kts')
          s = p.read_text()
          needle = '    buildFeatures { compose = true }\n'
          replacement = '''    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

              buildFeatures { compose = true }
          '''
          if needle not in s:
              raise SystemExit('Expected buildFeatures marker not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and install API 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: /tmp/codigo-build/codigo_estrada_pt_app
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        working-directory: /tmp/codigo-build/codigo_estrada_pt_app
        run: gradle assembleDebug --stacktrace

      - name: Verify APK and checksum
        run: |
          APK=/tmp/codigo-build/codigo_estrada_pt_app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" CodigoEstradaPT-v0.4.0-debug.apk
          sha256sum CodigoEstradaPT-v0.4.0-debug.apk | tee CodigoEstradaPT-v0.4.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodigoEstradaPT-v0.4.0-APK
          path: |
            CodigoEstradaPT-v0.4.0-debug.apk
            CodigoEstradaPT-v0.4.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
