name: Codigo Estrada PT - Build Premium v0.9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/codigo-estrada-android-v0.7
    paths:
      - 'codigo-estrada-android-build/v0.9/patch/**'
      - '.github/workflows/codigo-estrada-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.8 base
        run: |
          cat \
            codigo-estrada-android-build/v0.8/payload/chunk_00.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_01.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_02.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_03.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_04.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_05.b64 \
            > /tmp/CodigoEstradaPT_Android_v0.8-final.b64
          base64 -d /tmp/CodigoEstradaPT_Android_v0.8-final.b64 > /tmp/CodigoEstradaPT_Android_v0.8-final.zip
          echo "6e14e65867164d5c2ed66087ef2827ebdb3f5b7ccf6256ea32d8f9ce6a01b585  /tmp/CodigoEstradaPT_Android_v0.8-final.zip" | sha256sum -c -
          rm -rf /tmp/codigo-build
          mkdir -p /tmp/codigo-build
          unzip -q /tmp/CodigoEstradaPT_Android_v0.8-final.zip -d /tmp/codigo-build

      - name: Apply and verify v0.9 Premium UI patch
        run: |
          base64 -d codigo-estrada-android-build/v0.9/patch/App.kt.gz.b64 | gzip -d > /tmp/codigo-build/app/src/main/java/pt/carreira/codigoestrada/App.kt
          cp codigo-estrada-android-build/v0.9/patch/app-build.gradle.kts /tmp/codigo-build/app/build.gradle.kts
          echo "ecfe87bf20f7b7a621dc3795a5cf4711510a750b807abd6776b872106ba38621  /tmp/codigo-build/app/src/main/java/pt/carreira/codigoestrada/App.kt" | sha256sum -c -
          grep -q 'versionName = "0.9.0"' /tmp/codigo-build/app/build.gradle.kts
          grep -q 'versionCode = 9' /tmp/codigo-build/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK API 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow

      - name: Fetch official Portuguese road-sign artwork
        working-directory: /tmp/codigo-build
        run: |
          python3 tools/fetch_official_signs.py
          COUNT=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'sign_*.png' | wc -l)
          echo "Official sign resources: $COUNT"
          test "$COUNT" -eq 31

      - name: Unit and editorial quality tests
        working-directory: /tmp/codigo-build
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        working-directory: /tmp/codigo-build
        run: gradle assembleDebug --stacktrace

      - name: Verify APK and checksum
        run: |
          APK=/tmp/codigo-build/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" CodigoEstradaPT-v0.9.0-premium-debug.apk
          sha256sum CodigoEstradaPT-v0.9.0-premium-debug.apk | tee CodigoEstradaPT-v0.9.0-premium-debug.apk.sha256
          unzip -t CodigoEstradaPT-v0.9.0-premium-debug.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodigoEstradaPT-v0.9.0-Premium-APK
          path: |
            CodigoEstradaPT-v0.9.0-premium-debug.apk
            CodigoEstradaPT-v0.9.0-premium-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
