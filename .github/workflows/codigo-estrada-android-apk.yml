name: Codigo Estrada PT - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/codigo-estrada-android-v0.5
    paths:
      - 'codigo-estrada-android-build/v0.5/payload/**'
      - '.github/workflows/codigo-estrada-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify v0.5 source package
        run: |
          {
            printf 'U'
            cat codigo-estrada-android-build/v0.5/payload/chunk_00.b64
            printf 'W'
            cat codigo-estrada-android-build/v0.5/payload/chunk_01.b64
            printf 'f'
            cat codigo-estrada-android-build/v0.5/payload/chunk_02.b64
            printf 'V'
            cat codigo-estrada-android-build/v0.5/payload/chunk_03.b64
            cat codigo-estrada-android-build/v0.5/payload/chunk_04.b64
          } > /tmp/CodigoEstradaPT_Android_v0.5.b64
          base64 -d /tmp/CodigoEstradaPT_Android_v0.5.b64 > /tmp/CodigoEstradaPT_Android_v0.5.zip
          echo "b79bc70c42f8bd85bedfdd67e93cd4d1362722b3c0e9ae78a1919c06bb488892  /tmp/CodigoEstradaPT_Android_v0.5.zip" | sha256sum -c -
          mkdir -p /tmp/codigo-build
          unzip -q /tmp/CodigoEstradaPT_Android_v0.5.zip -d /tmp/codigo-build
          test -f /tmp/codigo-build/codigo_estrada_pt_app/settings.gradle.kts
          test -f /tmp/codigo-build/codigo_estrada_pt_app/OFFICIAL_SIGN_SOURCES.csv

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and install API 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow

      - name: Fetch official Portuguese road-sign artwork
        working-directory: /tmp/codigo-build/codigo_estrada_pt_app
        run: |
          python3 tools/fetch_official_signs.py
          COUNT=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'sign_*.png' | wc -l)
          echo "Official sign resources: $COUNT"
          test "$COUNT" -eq 31

      - name: Unit and editorial quality tests
        working-directory: /tmp/codigo-build/codigo_estrada_pt_app
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        working-directory: /tmp/codigo-build/codigo_estrada_pt_app
        run: gradle assembleDebug --stacktrace

      - name: Verify APK and checksum
        run: |
          APK=/tmp/codigo-build/codigo_estrada_pt_app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" CodigoEstradaPT-v0.5.0-debug.apk
          sha256sum CodigoEstradaPT-v0.5.0-debug.apk | tee CodigoEstradaPT-v0.5.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodigoEstradaPT-v0.5.0-APK
          path: |
            CodigoEstradaPT-v0.5.0-debug.apk
            CodigoEstradaPT-v0.5.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
