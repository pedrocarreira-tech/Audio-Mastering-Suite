name: Codigo Estrada PT - Build v1.1 Symbols Marks APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/codigo-estrada-android-v0.7
    paths:
      - 'codigo-estrada-android-build/v1.1/patch/**'
      - '.github/workflows/codigo-estrada-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.8 base
        run: |
          cat \
            codigo-estrada-android-build/v0.8/payload/chunk_00.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_01.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_02.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_03.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_04.b64 \
            codigo-estrada-android-build/v0.8/payload/chunk_05.b64 \
            > /tmp/v08.b64
          base64 -d /tmp/v08.b64 > /tmp/v08.zip
          echo "6e14e65867164d5c2ed66087ef2827ebdb3f5b7ccf6256ea32d8f9ce6a01b585  /tmp/v08.zip" | sha256sum -c -
          rm -rf /tmp/codigo-build && mkdir -p /tmp/codigo-build
          unzip -q /tmp/v08.zip -d /tmp/codigo-build

      - name: Apply verified v0.9 UI base
        run: |
          base64 -d codigo-estrada-android-build/v0.9/patch/App.kt.gz.b64 | gzip -d > /tmp/codigo-build/app/src/main/java/pt/carreira/codigoestrada/App.kt
          cp codigo-estrada-android-build/v0.9/patch/app-build.gradle.kts /tmp/codigo-build/app/build.gradle.kts
          echo "ecfe87bf20f7b7a621dc3795a5cf4711510a750b807abd6776b872106ba38621  /tmp/codigo-build/app/src/main/java/pt/carreira/codigoestrada/App.kt" | sha256sum -c -

      - name: Reconstruct and apply verified v1.0 patch
        run: |
          cat \
            codigo-estrada-android-build/v1.0/patch/chunk_00.b64 \
            codigo-estrada-android-build/v1.0/patch/chunk_01a.b64 \
            codigo-estrada-android-build/v1.0/patch/chunk_02.b64 \
            codigo-estrada-android-build/v1.0/patch/chunk_03.b64 \
            codigo-estrada-android-build/v1.0/patch/chunk_04.b64 \
            > /tmp/v10-patch.b64
          base64 -d /tmp/v10-patch.b64 > /tmp/v10-patch.zip
          echo "0774aa90a236c6ea1b1ad1790e5d8d784ddb3ccaaa93867de4856a43b0f10cc8  /tmp/v10-patch.zip" | sha256sum -c -
          unzip -oq /tmp/v10-patch.zip -d /tmp/codigo-build
          cp codigo-estrada-android-build/v1.0/hotfix/fetch_official_signs.py /tmp/codigo-build/tools/fetch_official_signs.py
          test "$(git hash-object /tmp/codigo-build/tools/fetch_official_signs.py)" = "091fed22f2949c110da43f3b2571e625d4f054d0"
          grep -q 'versionName = "1.0.0"' /tmp/codigo-build/app/build.gradle.kts
          grep -q 'versionCode = 10' /tmp/codigo-build/app/build.gradle.kts
          grep -q '2026.09.19-v10-full-signage-1300q' /tmp/codigo-build/app/src/main/java/pt/carreira/codigoestrada/ContentData.kt

      - name: Reconstruct and apply verified v1.1 patch
        run: |
          cat \
            codigo-estrada-android-build/v1.1/patch/chunk_00.b64 \
            codigo-estrada-android-build/v1.1/patch/chunk_01.b64 \
            codigo-estrada-android-build/v1.1/patch/chunk_02a.b64 \
            codigo-estrada-android-build/v1.1/patch/chunk_02b.b64 \
            codigo-estrada-android-build/v1.1/patch/chunk_03.b64 \
            codigo-estrada-android-build/v1.1/patch/chunk_04a.b64 \
            codigo-estrada-android-build/v1.1/patch/chunk_04b.b64 \
            codigo-estrada-android-build/v1.1/patch/chunk_05.b64 \
            codigo-estrada-android-build/v1.1/patch/chunk_06.b64 \
            codigo-estrada-android-build/v1.1/patch/chunk_07.b64 \
            > /tmp/v11-patch.b64
          base64 -d /tmp/v11-patch.b64 > /tmp/v11-patch.zip
          echo "c7851ad7c95e9b601ab4d5812e88b3d61ee3877e73e38a178e83240458c4dcdf  /tmp/v11-patch.zip" | sha256sum -c -
          unzip -oq /tmp/v11-patch.zip -d /tmp/codigo-build
          grep -q 'versionName = "1.1.0"' /tmp/codigo-build/app/build.gradle.kts
          grep -q 'versionCode = 11' /tmp/codigo-build/app/build.gradle.kts
          grep -q '2026.09.19-v11-symbols-marks-1600q' /tmp/codigo-build/app/src/main/java/pt/carreira/codigoestrada/ContentData.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK API 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install catalog tooling
        run: python3 -m pip install --quiet pillow beautifulsoup4

      - name: Fetch official signs and symbols catalog
        working-directory: /tmp/codigo-build
        run: |
          python3 tools/fetch_official_signs.py
          SIGN_COUNT=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'sign_*.png' | wc -l)
          SYMBOL_COUNT=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'symbol_*.png' | wc -l)
          echo "Official sign resources: $SIGN_COUNT"
          echo "Official symbol resources: $SYMBOL_COUNT"
          test "$SIGN_COUNT" -ge 100
          test "$SYMBOL_COUNT" -ge 1
          test -s app/src/main/res/raw/official_sign_catalog.json
          test -s app/src/main/res/raw/official_symbol_catalog.json
          python3 - <<'PY'
          import json
          signs=json.load(open('app/src/main/res/raw/official_sign_catalog.json',encoding='utf-8'))
          symbols=json.load(open('app/src/main/res/raw/official_symbol_catalog.json',encoding='utf-8'))
          print("Sign catalog records:", len(signs))
          print("Symbol catalog records:", len(symbols))
          assert len(signs) >= 100
          assert len(symbols) >= 1
          PY

      - name: Unit and editorial quality tests
        working-directory: /tmp/codigo-build
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        working-directory: /tmp/codigo-build
        run: gradle assembleDebug --stacktrace

      - name: Verify APK and checksum
        run: |
          APK=/tmp/codigo-build/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" CodigoEstradaPT-v1.1.0-premium-debug.apk
          sha256sum CodigoEstradaPT-v1.1.0-premium-debug.apk | tee CodigoEstradaPT-v1.1.0-premium-debug.apk.sha256
          unzip -t CodigoEstradaPT-v1.1.0-premium-debug.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodigoEstradaPT-v1.1.0-Premium-APK
          path: |
            CodigoEstradaPT-v1.1.0-premium-debug.apk
            CodigoEstradaPT-v1.1.0-premium-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
