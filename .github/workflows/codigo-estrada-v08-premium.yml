name: Codigo Estrada PT v0.8 Premium - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/codigo-estrada-android-v0.8-premium
    paths:
      - 'codigo-estrada-android-build/v0.8/payload/**'
      - '.github/workflows/codigo-estrada-v08-premium.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify v0.4 base package
        run: |
          cat codigo-estrada-android-build/payload/chunk_*.b64 > /tmp/CodigoEstradaPT_Android_v0.4.b64
          base64 -d /tmp/CodigoEstradaPT_Android_v0.4.b64 > /tmp/CodigoEstradaPT_Android_v0.4.zip
          echo "7487f8c08e117859af625cdd4509284a7148c7fcec5b0f34b842296285a5470c  /tmp/CodigoEstradaPT_Android_v0.4.zip" | sha256sum -c -
          mkdir -p /tmp/codigo-v08
          unzip -q /tmp/CodigoEstradaPT_Android_v0.4.zip -d /tmp/codigo-v08
          test -f /tmp/codigo-v08/codigo_estrada_pt_app/settings.gradle.kts

      - name: Reconstruct and verify v0.8 premium patch
        run: |
          cat codigo-estrada-android-build/v0.8/payload/chunk_*.b64 > /tmp/CodigoEstradaPT_v0.8_patch.b64
          base64 -d /tmp/CodigoEstradaPT_v0.8_patch.b64 > /tmp/CodigoEstradaPT_v0.8_patch.zip
          echo "c1dd8a7d5a9cec7d2344833d1d80520da92f7e7cd12fc3367658e9a3d411b130  /tmp/CodigoEstradaPT_v0.8_patch.zip" | sha256sum -c -
          unzip -qo /tmp/CodigoEstradaPT_v0.8_patch.zip -d /tmp/codigo-v08/codigo_estrada_pt_app
          cd /tmp/codigo-v08/codigo_estrada_pt_app
          python3 apply_base_edits.py
          grep -q 'versionName = "0.8.0"' app/build.gradle.kts
          test -f app/src/main/java/pt/carreira/codigoestrada/ContentV7.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK API 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow

      - name: Fetch official Portuguese road-sign artwork
        working-directory: /tmp/codigo-v08/codigo_estrada_pt_app
        run: |
          python3 tools/fetch_official_signs.py
          COUNT=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f -name 'sign_*.png' | wc -l)
          echo "Official sign resources: $COUNT"
          test "$COUNT" -eq 31

      - name: Unit and editorial quality tests
        working-directory: /tmp/codigo-v08/codigo_estrada_pt_app
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable premium debug APK
        working-directory: /tmp/codigo-v08/codigo_estrada_pt_app
        run: gradle assembleDebug --stacktrace

      - name: Verify APK and checksum
        run: |
          APK=/tmp/codigo-v08/codigo_estrada_pt_app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" CodigoEstradaPT-v0.8.0-premium-debug.apk
          sha256sum CodigoEstradaPT-v0.8.0-premium-debug.apk | tee CodigoEstradaPT-v0.8.0-premium-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodigoEstradaPT-v0.8.0-premium-APK
          path: |
            CodigoEstradaPT-v0.8.0-premium-debug.apk
            CodigoEstradaPT-v0.8.0-premium-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
